<!DOCTYPE html>
<!-- CareSlot · Design System — example project for nexus v4 (made up). Covers (reference — not a screen) -->
<html><head><meta charset="utf-8"><title>Design System</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fa;color:#1b2430}
.card{background:#ffffff;border:1px solid #d5dde5;border-radius:8px;padding:20px;max-width:420px;margin:24px auto}
.btn{background:#0f766e;color:#ffffff;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.btn[disabled]{background:#eef2f5;color:#4f5d6b;cursor:not-allowed}
.hint{color:#4f5d6b;font-size:13px} .err{color:#b42318;font-size:13px}
.ok{color:#15803d} .warn{color:#9a5b00}</style></head>
<body>
<div class="card"><div style="background:#ffffff;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--background"></div><div style="background:#1b2430;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--foreground"></div><div style="background:#f6f8fa;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--surface"></div><div style="background:#0f766e;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--primary"></div><div style="background:#ffffff;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--primary-foreground"></div><div style="background:#eef2f5;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--muted"></div><div style="background:#4f5d6b;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--muted-foreground"></div><div style="background:#d5dde5;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--border"></div><div style="background:#b42318;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--destructive"></div><div style="background:#15803d;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--success"></div><div style="background:#9a5b00;width:40px;height:40px;display:inline-block;border:1px solid #d5dde5" title="--warning"></div></div>
</body></html>
