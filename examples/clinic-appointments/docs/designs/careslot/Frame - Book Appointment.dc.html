<!DOCTYPE html>
<!-- CareSlot · Book Appointment — example project for nexus v4 (made up). Epic E001 — Booking. Covers US-002, US-003, FR-BOOK-001, FR-BOOK-002, FR-BOOK-003, NFR-001 -->
<html><head><meta charset="utf-8"><title>Book Appointment</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fa;color:#1b2430}
.card{background:#ffffff;border:1px solid #d5dde5;border-radius:8px;padding:20px;max-width:420px;margin:24px auto}
.btn{background:#0f766e;color:#ffffff;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.btn[disabled]{background:#eef2f5;color:#4f5d6b;cursor:not-allowed}
.hint{color:#4f5d6b;font-size:13px} .err{color:#b42318;font-size:13px}
.ok{color:#15803d} .warn{color:#9a5b00}</style></head>
<body>
<div class="card">
  <h2>Book an appointment</h2>
  <p class="hint">Dr. Ana Reyes · Main clinic · next 30 days</p>
  <div><button class="btn">09:00</button> <button class="btn">09:20</button> <button class="btn" disabled>09:40</button></div>
  <!-- state: loading --><p class="hint">Loading free slots…</p>
  <!-- state: empty --><p class="hint">No free slots on this day</p>
  <!-- state: error --><p class="err">This slot was just taken — pick another one.</p>
  <!-- state: error --><p class="err">You already have 2 upcoming appointments.</p>
  <p class="ok">Booked: Tue 3 Dec, 09:20</p>
</div>
</body></html>
