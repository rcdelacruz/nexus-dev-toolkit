# Local stack (architecture §7): web, worker, beat, PostgreSQL, Redis.
services:
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: .
    env_file: .env
    command: celery -A careslot worker -l info
    depends_on: [db, redis]
  beat:
    build: .
    env_file: .env
    command: celery -A careslot beat -l info   # exactly one instance (ADR-…-E001-003)
    depends_on: [redis]
  db:
    image: postgres:16
    environment: {POSTGRES_DB: careslot, POSTGRES_USER: careslot, POSTGRES_PASSWORD: careslot}
  redis:
    image: redis:7
