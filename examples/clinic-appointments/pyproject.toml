# CareSlot — reference scaffold (Day 0) for the nexus v4 example. Made up.
# Versions pinned exactly, resolved by resolve_package_versions (uv) — never from memory.
[project]
name = "careslot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.19",
    "psycopg[binary]==3.3.9",
    "celery==5.7.0",
    "redis==5.3.1",
    "django-htmx==1.29.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-django==4.14.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "careslot.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]   # generated by Django

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
