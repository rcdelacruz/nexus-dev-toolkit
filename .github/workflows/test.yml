name: Tests

on:
  push:
    branches: [main, v4]
    paths-ignore:
      - 'public/**'
  pull_request:
    branches: [main, v4]
    paths-ignore:
      - 'public/**'
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} --with "pytest>=8.0.0" --with "pytest-asyncio>=0.23.0" --with "tomli>=2.0.0; python_version < '3.11'" pytest tests/ -v
